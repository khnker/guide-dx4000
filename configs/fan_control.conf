[fan_control]
# Fan control configuration for DX4000 NAS
# Values loaded by /usr/local/bin/fan_control.py
# Manual override: set values here and restart fan-control.service

# PWM limits (0-255 range of hwmon)
FAN_MIN = 14
FAN_MAX = 255
FAN_MAX_CAP = 178
START_PWM = 70

# Temperature targets (Celsius)
CORE_IDLE = 35
CORE_TARGET = 45
CORE_CRITICAL = 60
DISK_TARGET = 45
DISK_HARD_LIMIT = 50

# Proactive ramp zones (Celsius) - start increasing BEFORE critical
DISK_RAMP_START = 42    # Begin gradual PWM increase (zone verde/amarilla)
DISK_RAMP_STEP = 2      # PWM increment per ramp step

# Auto-tune: hard floor from config (set by user observation)
# Fan never goes below this value unless emergency
PWM_FLOOR = 70

# Auto-tune parameters
PWM_STABLE_THRESHOLD = 3
DECREASE_STEP = 3
DEADBAND_HIGH = 1
UNLOCK_THRESHOLD = 3          # Temp below DISK_TARGET to attempt unlock (degrees)
LEARN_FLOOR_BOOST = 5
MIN_STABILIZE_SECONDS = 45
OBSERVATION_WINDOW = 5400
PROBE_INTERVAL = 900

# Polling interval (seconds)
FAN_INTERVAL = 5
